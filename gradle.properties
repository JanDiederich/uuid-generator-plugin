# IntelliJ Platform Artifacts Repositories
# -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = com.github.leomillon.uuidgenerator
pluginName = UUID Generator
pluginDescription = UUID Generator
pluginVersion = 5.0.0

# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# for insight into build numbers and IntelliJ Platform versions.
pluginSinceBuild = 261
pluginUntilBuild =

# Plugin Verifier integration -> https://github.com/JetBrains/gradle-intellij-plugin#plugin-verifier-dsl
# See https://jb.gg/intellij-platform-builds-list for available build versions.
pluginVerifierIdeVersions = 2026.1

platformType = IU
platformVersion = 2026.1
platformDownloadSources = true

# Failure Levels: https://github.com/JetBrains/gradle-intellij-plugin/blob/master/src/main/kotlin/org/jetbrains/intellij/tasks/RunPluginVerifierTask.kt
#pluginVerifierExcludeFailureLevels = PLUGIN_STRUCTURE_WARNINGS
# Mute Plugin Problems -> https://github.com/JetBrains/intellij-plugin-verifier?tab=readme-ov-file#check-plugin
# Used to mute (ignore) a comma-seperated list of plugin problems.
pluginVerifierMutePluginProblems = TemplateWordInPluginName

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.intellij.java, com.jetbrains.php:203.4449.22
platformPlugins = com.intellij.modules.json, com.intellij.java, org.jetbrains.kotlin

# Java language level used to compile sources and to generate the files for - Java 11 is required since 2020.3
javaVersion = 21

gradleVersion = 9.4.1

# Opt-out flag for bundling Kotlin standard library.
# See https://plugins.jetbrains.com/docs/intellij/kotlin.html#kotlin-standard-library for details.
# suppress inspection "UnusedProperty"
kotlin.stdlib.default.dependency = false

# Dependencies
detekt-formatting.version = 1.14.2
commons-text.version = 1.9
jackson-module-kotlin.version = 2.11.+

# Tests dependencies
assertk-jvm.version = 0.28.1
junit.version = 5.6.0
